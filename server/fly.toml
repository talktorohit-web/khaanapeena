app = "khaanapeena-sync"
primary_region = "sin"   # Singapore — bom (Mumbai) had no capacity; sin still reaches the bom Postgres over Fly's private network

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # keep 1 machine warm — reliable reachability for
  auto_start_machines = true      # the invoice mirror (avoids scale-to-zero start flakiness)
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
